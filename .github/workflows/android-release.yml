name: Build & Release Android (APK + Play Store AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-android:
    name: Build Signed APK & Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install Web Dependencies & Build Web Assets
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Decode Release Keystore (if KEYSTORE_BASE64 secret is configured)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/android/arc-release-key.jks
          cat <<EOF > ${{ github.workspace }}/android/keystore.properties
          storeFile=${{ github.workspace }}/android/arc-release-key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS || 'arc-key' }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Debug & Release APK + Play Store AAB Bundle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug bundleRelease assembleRelease

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-store-bundle-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload Release & Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
